# Instala as dependências, roda o lint e os testes com uma versão de Python.
# Os testes usam SQLite em memória (sem variáveis DATABASE_*), então não precisam de MySQL.

name: DevOps 30/10/2026

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:

    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
    - name: Set up Python 3.12
      uses: actions/setup-python@v5
      with:
        python-version: "3.12"
        cache: pip
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        python -m pip install -r requirements.txt
    - name: Lint with pylint
      run: |
        pylint app tests
    - name: Test with pytest
      run: |
        pytest --cov=app
