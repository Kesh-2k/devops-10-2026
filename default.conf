server {
    listen localhost:8000;

    location /tarefas {
        if ($host ~* ^(.+)-8000\.app\.github\.dev$) {
            return 301 https://$1-8001.app.github.dev$request_uri;
        }

        proxy_pass http://localhost:8001/tarefas;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /notificar {
        proxy_pass http://localhost:8002/notificar;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}